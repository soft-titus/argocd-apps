apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-hpa
  namespace: argocd
spec:
  project: hello
  source:
    repoURL: https://soft-titus.github.io/titus-charts
    chart: microservice
    targetRevision: ">=0.0.0 <1.0.0"
    helm:
      values: |
        fullnameOverride: "hello-hpa"
        image:
          repository: ghcr.io/soft-titus/hello
          tag: "1.0.0"
        configMaps:
          env:
            enabled: true
            data:
              LOG_LEVEL: "INFO"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        hpa:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 75
        service:
          enabled: true
          ports:
            - name: http
              port: 80
              containerPort: 8080
        httpRoute:
          enabled: true
          parentRefs:
            - name: envoy-gateway
              namespace: envoy-gateway-system
          hostnames:
            - hello-hpa.heterodon.local
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: hello-hpa
                  port: 80
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-hpa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
