---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-vpa
  namespace: argocd
spec:
  project: hello
  source:
    repoURL: git@github.com:soft-titus/argocd-apps.git
    path: "env/heterodon/hello-vpa"
    targetRevision: main
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-vpa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
