microservice:
  fullnameOverride: "hello-vpa"
  image:
    repository: ghcr.io/soft-titus/hello
    tag: "0.0.0"
    argocdImageUpdater:
      enabled: true
      applicationNamespace: "argocd"
      applicationNamePattern: "hello-vpa"
      images:
      - alias: app
        imageName: ghcr.io/soft-titus/hello
        commonUpdateSettings:
          forceUpdate: true
          updateStrategy: semver
          allowTags: "regexp:^1\\.[0-9]+\\.[0-9]+$"
        manifestTargets:
          helm:
            name: microservice.image.repository
            tag: microservice.image.tag
      writeBackConfig:
        method: git
        gitConfig:
          writeBackTarget: "helmvalues:/env/heterodon/hello-vpa/values.yaml"
  configMaps:
    env:
      enabled: true
      data:
        LOG_LEVEL: "INFO"
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  vpa:
    enabled: true
    updateMode: InPlaceOrRecreate
    minReplicas: 1
    resourcePolicy:
      containerPolicies:
        - containerName: "*"
          minAllowed:
            cpu: 50m
            memory: 64Mi
          maxAllowed:
            cpu: "1"
            memory: 1Gi
          controlledValues: RequestsAndLimits
          controlledResources:
            - cpu
            - memory
  service:
    enabled: true
    ports:
    - name: http
      port: 80
      containerPort: 8080
  httpRoute:
    enabled: true
    parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
    hostnames:
    - hello-vpa.heterodon.local
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - name: hello-vpa
        port: 80
