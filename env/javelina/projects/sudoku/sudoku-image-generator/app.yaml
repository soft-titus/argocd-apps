---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sudoku-image-generator
  namespace: argocd
spec:
  project: sudoku
  source:
    repoURL: git@github.com:soft-titus/argocd-apps.git
    path: "env/javelina/charts/microservice"
    targetRevision: main
    helm:
      valueFiles:
        - ../../projects/sudoku/sudoku-image-generator/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sudoku
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
