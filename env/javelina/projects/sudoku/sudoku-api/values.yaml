microservice:
  fullnameOverride: "sudoku-api"
  image:
    repository: ghcr.io/soft-titus/sudoku-api
    tag: "1.2.5"
    argocdImageUpdater:
      enabled: true
      applicationNamespace: "argocd"
      applicationNamePattern: "sudoku-api"
      images:
      - alias: app
        imageName: ghcr.io/soft-titus/sudoku-api
        commonUpdateSettings:
          updateStrategy: semver
          allowTags: "regexp:^1\\.[0-9]+\\.[0-9]+$"
          forceUpdate: true
        manifestTargets:
          helm:
            name: microservice.image.repository
            tag: microservice.image.tag
      - alias: metrics
        imageName: ghcr.io/soft-titus/sudoku-api
        commonUpdateSettings:
          updateStrategy: semver
          allowTags: "regexp:^1\\.[0-9]+\\.[0-9]+$"
          forceUpdate: true
        manifestTargets:
          helm:
            spec: microservice.sidecars[0].image
            name: microservice.sidecars[0].image
            tag: microservice.sidecars[0].image
      writeBackConfig:
        method: git
        gitConfig:
          writeBackTarget: "helmvalues:/env/javelina/projects/sudoku/sudoku-api/values.yaml"
  configMaps:
    env:
      enabled: true
      data:
        LOG_LEVEL: "INFO"
        IMAGE_BASE_URL: "https://minio.javelina.local/sudoku"
        CACHE_TTL_HOURS: "168"
        KAFKA_PUZZLE_TOPIC: "sudoku.puzzle.generate"
        MONGO_DB: "sudoku"
        MONGO_COLLECTION_NAME: "puzzle"
        REDIS_DB: "0"
        S3_BUCKET_NAME: "sudoku"
        PROMETHEUS_MULTIPROC_DIR: "/tmp/metrics"
  envFrom:
  - configMapRef:
      name: redis-configmap
  - configMapRef:
      name: kafka-configmap
  - configMapRef:
      name: mongo-configmap
  - configMapRef:
      name: minio-configmap
  - secretRef:
      name: mongo-secrets
  - secretRef:
      name: minio-secrets
  serviceAccount:
    create: false
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  scaledObject:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    pollingInterval: 30
    cooldownPeriod: 300
    triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-stack-prometheus.prometheus.svc.cluster.local:9090
        metricName: sudoku_api_requests_per_second
        query: |
          sum(rate(sudoku_api_requests_total[1m]))
        threshold: "5"
  service:
    enabled: true
    ports:
    - name: http
      port: 80
      containerPort: 8080
    - name: metrics
      port: 9090
      containerPort: 9090
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-stack
    port: "metrics"
    path: "/metrics"
  httpRoute:
    enabled: true
    parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
    hostnames:
    - sudoku-api.javelina.local
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - name: sudoku-api
        port: 80
  volumes:
  - name: metrics-data
    emptyDir: {}
  volumeMounts:
  - name: metrics-data
    mountPath: /tmp/metrics
  sidecars:
  - name: metrics
    image: ghcr.io/soft-titus/sudoku-api:1.2.5
    imagePullPolicy: IfNotPresent
    ports:
    - name: metrics
      containerPort: 9090
    envFrom:
    - configMapRef:
        name: sudoku-api-env
    volumeMounts:
    - name: metrics-data
      mountPath: /tmp/metrics
    command:
    - "uvicorn"
    args:
    - "app.metrics_server:metrics_app"
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "9090"
  readinessProbe:
    enabled: true
    httpGet:
      scheme: HTTP
      port: http
      path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      scheme: HTTP
      port: http
      path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  podAnnotations:
    reloader.stakater.com/auto: "true"
