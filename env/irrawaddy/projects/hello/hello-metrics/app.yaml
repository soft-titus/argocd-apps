---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-metrics
  namespace: argocd
spec:
  project: hello
  source:
    repoURL: git@github.com:soft-titus/argocd-apps.git
    path: "env/irrawaddy/charts/microservice"
    targetRevision: main
    helm:
      valueFiles:
        - ../../projects/hello/hello-metrics/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-metrics
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
