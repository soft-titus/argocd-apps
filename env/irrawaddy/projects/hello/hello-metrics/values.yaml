microservice:
  fullnameOverride: "hello-metrics"
  image:
    repository: ghcr.io/soft-titus/hello-metrics
    tag: "1.1.0"
    argocdImageUpdater:
      enabled: true
      applicationNamespace: "argocd"
      applicationNamePattern: "hello-metrics"
      images:
      - alias: app
        imageName: ghcr.io/soft-titus/hello-metrics
        commonUpdateSettings:
          updateStrategy: semver
          allowTags: "regexp:^1\\.[0-9]+\\.[0-9]+$"
          forceUpdate: true
        manifestTargets:
          helm:
            name: microservice.image.repository
            tag: microservice.image.tag
      - alias: metrics
        imageName: ghcr.io/soft-titus/hello-metrics
        commonUpdateSettings:
          updateStrategy: semver
          allowTags: "regexp:^1\\.[0-9]+\\.[0-9]+$"
          forceUpdate: true
        manifestTargets:
          helm:
            spec: microservice.sidecars[0].image
            name: microservice.sidecars[0].image
            tag: microservice.sidecars[0].image
      writeBackConfig:
        method: git
        gitConfig:
          writeBackTarget: "helmvalues:/env/irrawaddy/projects/hello/hello-metrics/values.yaml"
  configMaps:
    env:
      enabled: true
      data:
        LOG_LEVEL: "INFO"
        PROMETHEUS_MULTIPROC_DIR: "/tmp/metrics"
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  scaledObject:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    pollingInterval: 30
    cooldownPeriod: 300
    triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-stack-prometheus.prometheus.svc.cluster.local:9090
        metricName: hello_requests_per_second
        query: |
          sum(rate(hello_requests_total[1m]))
        threshold: "5"
  service:
    enabled: true
    ports:
    - name: http
      port: 80
      containerPort: 8080
    - name: metrics
      port: 9090
      containerPort: 9090
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-stack
    port: "metrics"
    path: "/metrics"
  httpRoute:
    enabled: true
    parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
    hostnames:
    - hello-metrics.irrawaddy.local
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - name: hello-metrics
        port: 80
  volumes:
  - name: metrics-data
    emptyDir: {}
  volumeMounts:
  - name: metrics-data
    mountPath: /tmp/metrics
  sidecars:
  - name: metrics
    image: ghcr.io/soft-titus/hello-metrics:1.1.0
    imagePullPolicy: IfNotPresent
    ports:
    - name: metrics
      containerPort: 9090
    envFrom:
    - configMapRef:
        name: hello-metrics-env
    volumeMounts:
    - name: metrics-data
      mountPath: /tmp/metrics
    command:
    - "uvicorn"
    args:
    - "app.metrics_server:metrics_app"
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "9090"
