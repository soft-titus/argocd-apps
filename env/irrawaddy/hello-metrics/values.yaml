microservice:
  fullnameOverride: "hello-metrics"
  image:
    repository: ghcr.io/soft-titus/hello-metrics
    tag: "1.1.0"
    argocdImageUpdater:
      enabled: true
      applicationNamespace: "argocd"
      applicationNamePattern: "hello-metrics"
      images:
      - alias: app
        imageName: ghcr.io/soft-titus/hello-metrics
        commonUpdateSettings:
          forceUpdate: true
          updateStrategy: semver
          allowTags: "regexp:^1\\.[0-9]+\\.[0-9]+$"
        manifestTargets:
          helm:
            name: microservice.image.repository
            tag: microservice.image.tag
      writeBackConfig:
        method: git
        gitConfig:
          writeBackTarget: "helmvalues:/env/irrawaddy/hello-metrics/values.yaml"
  configMaps:
    env:
      enabled: true
      data:
        LOG_LEVEL: "INFO"
        PROMETHEUS_MULTIPROC_DIR: "/tmp/metrics"
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    enabled: true
    ports:
    - name: http
      port: 80
      containerPort: 8080
    - name: metrics
      port: 9090
      containerPort: 9090
  httpRoute:
    enabled: true
    parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
    hostnames:
    - hello-metrics.irrawaddy.local
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - name: hello-metrics
        port: 80
  volumes:
    - name: metrics-data
      emptyDir: {}
  volumeMounts:
    - name: metrics-data
      mountPath: /tmp/metrics
  sidecars:
    - name: metrics
      image:
        repository: "{{ .Values.image.repository }}"
        tag: "{{ .Values.image.tag }}"
        pullPolicy: IfNotPresent
      ports:
        - name: metrics
          containerPort: 9090
      envFrom:
        - configMapRef:
            name: {{ default (printf "%s-env" (include "microservice.fullname" .)) .Values.configMaps.env.name }}
      volumeMounts:
        - name: metrics-data
          mountPath: /tmp/metrics
      command:
        - "uvicorn"
      args:
        - "app.metrics_server:metrics_app"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "9090"
